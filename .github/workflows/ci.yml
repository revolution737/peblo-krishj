name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: |
          cd backend
          ruff check app/

      - name: Run Tests
        env:
          STORAGE_LOCAL_PATH: ./storage
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            cms/package-lock.json
            viewer/package-lock.json

      - name: Install CMS dependencies
        run: cd cms && npm ci

      - name: Lint CMS (oxlint)
        run: cd cms && npm run lint

      - name: Build CMS
        run: cd cms && npm run build

      - name: Install Viewer dependencies
        run: cd viewer && npm ci

      - name: Lint Viewer (oxlint)
        run: cd viewer && npm run lint

      - name: Build Viewer UI
        run: cd viewer && npm run build

  docker-compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

  deploy:
    needs: [backend-checks, frontend-checks, docker-compose-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build and tag Docker images
        run: |
          IMAGE_TAG=${{ github.sha }}
          echo "Building images with tag: $IMAGE_TAG"
          docker build -t peblo-backend:$IMAGE_TAG ./backend
          docker build --build-arg VITE_API_URL=https://api.peblo.tv -t peblo-cms:$IMAGE_TAG ./cms
          docker build --build-arg VITE_API_URL=https://api.peblo.tv -t peblo-viewer:$IMAGE_TAG ./viewer

      - name: Push images to registry (mock — replace with real ECR push)
        run: |
          IMAGE_TAG=${{ github.sha }}
          echo "In production, the following commands would run:"
          echo "  aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin \$ECR_REGISTRY"
          echo "  docker tag peblo-backend:$IMAGE_TAG \$ECR_REGISTRY/peblo-backend:$IMAGE_TAG"
          echo "  docker push \$ECR_REGISTRY/peblo-backend:$IMAGE_TAG"
          echo "  (repeat for cms and viewer images)"

      - name: Apply DB migrations (mock — run before routing traffic)
        run: |
          echo "In production, before updating the ECS service, a one-off migration task runs:"
          echo "  aws ecs run-task --cluster peblo-prod --task-definition peblo-migrate --overrides ..."
          echo "  This ensures DB schema is current before new API pods receive traffic."

      - name: Update ECS services (mock)
        run: |
          IMAGE_TAG=${{ github.sha }}
          echo "In production:"
          echo "  aws ecs update-service --cluster peblo-prod --service peblo-backend --force-new-deployment"
          echo "  aws ecs update-service --cluster peblo-prod --service peblo-cms    --force-new-deployment"
          echo "  aws ecs update-service --cluster peblo-prod --service peblo-viewer --force-new-deployment"
          echo "ECS performs a rolling deployment; old tasks stay healthy until new ones pass health checks."
