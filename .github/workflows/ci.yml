name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          STORAGE_LOCAL_PATH: ./storage
        run: |
          cd backend
          python -m pytest tests/

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            cms/package.json
            viewer/package.json

      - name: Build CMS
        run: |
          cd cms
          npm ci || npm install
          npm run build

      - name: Build Viewer UI
        run: |
          cd viewer
          npm ci || npm install
          npm run build

  docker-compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

  deploy:
    needs: [backend-checks, frontend-checks, docker-compose-check]
    runs-on: ubuntu-latest
    steps:
      - name: Mock Deploy Step
        run: |
          echo "Deploying to production..."
          echo "In a real scenario, this step would build the Docker images, tag them with the commit SHA,"
          echo "push them to a container registry like AWS ECR, and update the ECS task definitions."
