[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ignore B008 (Do not perform function call in argument defaults) as this is required by FastAPI Depends()
# Ignore I001 (Import block is un-sorted or un-formatted) as it's purely stylistic
# Ignore BLE001 and ASYNC230 which are overly pedantic for our use cases (like the seed script)
ignore = ["B008", "I001", "BLE001", "ASYNC230"]
