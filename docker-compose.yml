version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peblo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peblo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-peblo_tv}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo_tv"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-peblo}:${POSTGRES_PASSWORD:-peblo_dev_password}@postgres:5432/${POSTGRES_DB:-peblo_tv}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-local-dev-secret-key-do-not-use-in-prod}
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_PATH=/app/storage
      - SEED_ON_STARTUP=true
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
      - ./backend/seed_shows.json:/app/seed_shows.json
      - ./backend/reference.json:/app/reference.json
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  cms:
    build:
      context: ./cms
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

  viewer:
    build:
      context: ./viewer
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
